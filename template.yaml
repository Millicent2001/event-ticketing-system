AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Event Ticketing System
  Serverless application using AWS Lambda, API Gateway, and DynamoDB.

Globals:
  Function:
    Timeout: 3
    LoggingConfig:
      LogFormat: JSON

Resources:

  # =========================
  # Hello World Lambda
  # =========================
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello_world/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
        - x86_64
      Events:
        HelloWorld:
          Type: Api
          Properties:
            Path: /hello
            Method: get

  # =========================
  # List Events Lambda
  # =========================
  ListEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: list_events/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
        - x86_64
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        ListEvents:
          Type: Api
          Properties:
            Path: /events
            Method: get

  # =========================
  # Events DynamoDB Table
  # =========================
  EventsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: Events
      PrimaryKey:
        Name: eventId
        Type: String

  # =========================
  # Registrations DynamoDB Table
  # =========================
  RegistrationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Registrations
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: registrationId
          AttributeType: S
        - AttributeName: email
          AttributeType: S

      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
        - AttributeName: registrationId
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

# =========================
# Outputs
# =========================
Outputs:

  HelloWorldApi:
    Description: API Gateway endpoint URL for Hello World function
    Value: !Sub
      - "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/hello/"
      - {}

  ListEventsApi:
    Description: API Gateway endpoint URL for List Events function
    Value: !Sub
      - "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/events/"
      - {}

  HelloWorldFunction:
    Description: Hello World Lambda Function ARN
    Value: !GetAtt HelloWorldFunction.Arn

  ListEventsFunction:
    Description: List Events Lambda Function ARN
    Value: !GetAtt ListEventsFunction.Arn

  HelloWorldFunctionIamRole:
    Description: IAM Role created for Hello World function
    Value: !GetAtt HelloWorldFunctionRole.Arn

  ListEventsFunctionIamRole:
    Description: IAM Role created for List Events function
    Value: !GetAtt ListEventsFunctionRole.Arn